[project]
name = "mundial"
version = "0.1.0"
description = "Sistema de predicción de marcadores — Mundial 2026"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "streamlit>=1.58.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.9.0",
]

[project.scripts]
mundial = "mundial.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mundial"]

[tool.ruff]
line-length = 100
