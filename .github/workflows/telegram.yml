name: telegram

on:
  schedule:
    - cron: "0 13 * * *"   # resumen pre-partidos (los primeros kickoffs son ~15-16 UTC)
    - cron: "30 4 * * *"   # resultados de la jornada anterior (los últimos terminan ~03 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Actualizar datos, ajustar ratings y enviar resumen
        run: |
          uv run mundial actualizar
          uv run mundial ratings
          uv run mundial telegram
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
